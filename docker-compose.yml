services:
  web:
    build: .
    container_name: monastery_api
    ports:
      - "5000:5000"
    depends_on:
      - db
    environment:
      SQLALCHEMY_DATABASE_URI: "mysql+pymysql://user:pass@db/monastery_db"

  db:
    image: mysql:8.0
    container_name: monastery_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: monastery_db
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
